pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

dependencyResolutionManagement {
    repositories {
        exclusiveContent {
            forRepository {
                maven { url = 'https://maven.neoforged.net/releases' }
            }
            filter {
                includeGroup 'net.neoforged.jst'
                includeModule 'net.neoforged', 'srgutils'
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'jst-mcp'
